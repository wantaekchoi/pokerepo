# Refetch Pokémon data. A new generation arrives through this job.
name: refresh data
on:
  schedule: [{ cron: "0 0 1 * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/build-data.mjs
      - name: Commit when changed and move the major tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/species.json
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: refresh Pokémon data"
          git push
          git tag -f v1 && git push -f origin v1
